name: sneakdrop

services:
  db:
    image: postgres:17-alpine
    container_name: sneaker_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sneakdrop}
      POSTGRES_USER: ${POSTGRES_USER:-sneakdrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sneakdrop}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_EXPOSED_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sneaker_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sneaker_backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-development-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      POSTGRES_DB: ${POSTGRES_DB:-sneakdrop}
      POSTGRES_USER: ${POSTGRES_USER:-sneakdrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sneakdrop}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_EXPOSED_PORT:-8000}:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
      python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD-SHELL", "python manage.py check --database default"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sneaker_celery
    restart: unless-stopped
    volumes:
      - ./backend:/app
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-development-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      POSTGRES_DB: ${POSTGRES_DB:-sneakdrop}
      POSTGRES_USER: ${POSTGRES_USER:-sneakdrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sneakdrop}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
    depends_on:
      backend:
        condition: service_healthy
    command: celery -A config worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2}

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sneaker_celery_beat
    restart: unless-stopped
    volumes:
      - ./backend:/app
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-development-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      POSTGRES_DB: ${POSTGRES_DB:-sneakdrop}
      POSTGRES_USER: ${POSTGRES_USER:-sneakdrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sneakdrop}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_healthy
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sneaker_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_EXPOSED_PORT:-3000}:3000"
    command: npm run dev -- --host 0.0.0.0 --port 3000

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
